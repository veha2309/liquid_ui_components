name: liquid_ui_components
description: Liquid glass surfaces, controls, alerts, prompts, panels, morphing, blending and spring navigation for Flutter, with frosted and opaque fallbacks.
version: 0.3.0
repository: https://github.com/veha2309/liquid_ui_components
issue_tracker: https://github.com/veha2309/liquid_ui_components/issues
topics:
  - navigation
  - liquid-glass
  - android
  - widgets
  - ui

screenshots:
  - description: Droplet, Jelly and Merge component captures in Frosted mode.
    path: screenshots/v0.3.0/morph-styles.png
  - description: Controls, navigation and shared glass surfaces on Android.
    path: screenshots/v0.3.0/controls-light.png
  - description: Inline alerts and contextual action panels on Android.
    path: screenshots/v0.3.0/alerts-and-panels.png
  - description: Themed glass confirmation prompt on Android.
    path: screenshots/v0.3.0/confirmation.png
  - description: Multiple draggable glass blend members on Android.
    path: screenshots/v0.3.0/blending.png
  - description: Dark-theme glass prompt on Android.
    path: screenshots/v0.3.0/confirmation-dark.png
environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  liquid_glass_easy: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
platforms:
  android:

flutter:
  shaders:
    - shaders/liquid_glass.frag
